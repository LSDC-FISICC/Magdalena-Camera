/**:
  ros__parameters:
    projector:      false   # IR dot projector
    infra2_enabled: false   # right infrared stream; the classifier uses color only
    color_width:   640
    color_height:  360
    color_fps:     15
    infra2_width:  640
    infra2_height: 360
    infra2_fps:    15
    # Stream watchdog: restart when the color rate stays below fraction x color_fps
    watchdog_min_fraction: 0.67   # 0.0 disables restarts (write it as a float)
    watchdog_low_s:        3      # seconds below the threshold before a restart is scheduled
    watchdog_jitter_s:     3.0    # random wait, cancelled if the rate recovers
    watchdog_grace_s:      15.0   # no decisions after a start or restart
    watchdog_max_per_min:  3

